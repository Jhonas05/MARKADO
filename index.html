<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MARKADO student and professor assessment experience prototype"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="application-name" content="MARKADO" />
    <link rel="icon" href="./server/public/branding/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./server/public/branding/apple-touch-icon.png" sizes="180x180" />
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('markado-theme')
          const preference = ['light', 'dark', 'system'].includes(stored) ? stored : 'system'
          const dark = preference === 'dark'
            || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          const root = document.documentElement
          root.classList.toggle('dark', dark)
          root.dataset.theme = dark ? 'dark' : 'light'
          root.dataset.themePreference = preference
          document.querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', dark ? '#0A0A0A' : '#FFFFFF')
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('motion-ok')
        } catch {}
      })()
    </script>
    <title>MARKADO | Assessment experience prototype</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
