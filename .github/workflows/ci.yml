name: UI checks

on:
  push:
    branches: ['main', 'feat/**', 'fix/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  laravel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install PHP dependencies
        run: composer install --working-dir=server --no-interaction --no-progress --prefer-dist

      - name: Prepare test environment
        run: |
          cp server/.env.example server/.env
          php server/artisan key:generate --ansi

      - name: Install frontend dependencies
        run: npm ci --prefix server

      - name: Check PHP formatting
        run: server/vendor/bin/pint --test --ansi

      - name: Test Laravel and Inertia
        run: php server/artisan test

      - name: Build Laravel frontend
        run: npm run build --prefix server

